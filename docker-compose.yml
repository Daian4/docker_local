version: "3.8"

services:
  site:
    image: nginx
    deploy:
      replicas: 8
      placement:
        constraints: [node.role == worker or node.role == manager]
    ports:
      - "8000:80"
  visualizer:
    image: dockersamples/visualizer:stable
    ports:
      - "8888:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
    deploy:
      replicas: 2
      placement:
        constraints: [node.role == worker or node.role == manager]
